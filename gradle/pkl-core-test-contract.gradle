import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.jvm.tasks.Jar
import org.gradle.api.tasks.testing.Test

gradle.afterProject { project ->
  if (project.path != ":pkl-core") {
    return
  }

  def contractDir = project.providers.gradleProperty("dripsharp.contractDir")
  def listenerBuildDir = project.layout.buildDirectory.dir("dripsharp-pkl-core-contract")
  def compileListener = project.tasks.register(
    "dripsharpCompilePklCoreContractListener", JavaCompile
  ) { compileTask ->
    compileTask.source(project.file("${contractDir.get()}/PklCoreTestDiscoveryListener.java"))
    compileTask.classpath = project.configurations.testRuntimeClasspath
    compileTask.destinationDirectory.set(listenerBuildDir.map { it.dir("classes") })
    compileTask.options.release.set(17)
  }
  def listenerJar = project.tasks.register(
    "dripsharpPklCoreContractListenerJar", Jar
  ) { jarTask ->
    jarTask.dependsOn(compileListener)
    jarTask.archiveFileName.set("pkl-core-test-contract-listener.jar")
    jarTask.destinationDirectory.set(listenerBuildDir)
    jarTask.from(compileListener.flatMap { it.destinationDirectory })
    jarTask.from(project.file("${contractDir.get()}/META-INF")) {
      into("META-INF")
    }
  }

  project.tasks.withType(Test).matching { it.name == "test" }.configureEach { testTask ->
    def discoveryOutput = project.providers.gradleProperty("dripsharp.discoveryOutput")

    testTask.dependsOn(listenerJar)
    testTask.classpath += project.files(listenerJar.flatMap { it.archiveFile })
    testTask.systemProperty("dripsharp.pklCoreContractOutput", discoveryOutput.get())
    testTask.inputs.file(project.file("${contractDir.get()}/PklCoreTestDiscoveryListener.java"))
    testTask.inputs.file(
      project.file("${contractDir.get()}/META-INF/services/org.junit.platform.launcher.TestExecutionListener")
    )
    testTask.outputs.file(project.file(discoveryOutput.get()))
    testTask.useJUnitPlatform {
      excludeEngines("LanguageSnippetTestsEngine")
    }
  }
}
