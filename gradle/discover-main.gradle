import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.JavaVersion
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import java.security.MessageDigest

def dripsharpSha256 = { File input ->
  MessageDigest digest = MessageDigest.getInstance("SHA-256")
  input.withInputStream { stream ->
    byte[] buffer = new byte[8192]
    int read
    while ((read = stream.read(buffer)) >= 0) {
      if (read > 0) digest.update(buffer, 0, read)
    }
  }
  digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

gradle.projectsEvaluated {
  def projectPath = gradle.rootProject.providers.gradleProperty("dripsharp.project").orElse(":pkl-parser").get()
  def selectedProject = gradle.rootProject.findProject(projectPath)
  if (selectedProject != null) {
    def compileJavaProvider = selectedProject.tasks.named("compileJava")
    def processResourcesProvider = selectedProject.tasks.named("processResources")
    def compileTestJavaProvider = selectedProject.tasks.named("compileTestJava")
    def processTestResourcesProvider = selectedProject.tasks.named("processTestResources")
    selectedProject.tasks.register("dripsharpDescribeMain") {
      group = "dripsharp"
      description = "Reports resolved ${projectPath} production and test inputs to DripSharp"
      dependsOn(compileJavaProvider, processResourcesProvider,
                compileTestJavaProvider, processTestResourcesProvider)

      doLast {
        def outputProperty = gradle.rootProject.providers.gradleProperty("dripsharp.output")
        if (!outputProperty.present) {
          throw new GradleException("Missing required -Pdripsharp.output=<path>")
        }

        def sourceSets = selectedProject.extensions.getByType(SourceSetContainer)
        def main = sourceSets.getByName("main")
        def test = sourceSets.getByName("test")
        def compileJava = compileJavaProvider.get()
        def compileTestJava = compileTestJavaProvider.get()
        def processResources = processResourcesProvider.get()
        def processTestResources = processTestResourcesProvider.get()
        def javaHome = compileJava.javaCompiler.present
          ? compileJava.javaCompiler.get().metadata.installationPath.asFile
          : new File(System.getProperty("java.home"))
        def javaRelease = compileJava.options.release.orNull
        if (javaRelease == null) {
          javaRelease = Integer.parseInt(JavaVersion.toVersion(compileJava.sourceCompatibility).majorVersion)
        }
        def previewFeatures = compileJava.options.compilerArgs.contains("--enable-preview")
        def records = []
        def buildRoot = selectedProject.layout.buildDirectory.get().asFile.canonicalFile
        def sourceRoots = main.java.srcDirs
          .findAll { it.isDirectory() }
          .collect { it.canonicalFile }
          .toSet()
        def generatedSourceRoots = sourceRoots.findAll {
          it.toPath().startsWith(buildRoot.toPath())
        }.toSet()
        def testSourceRoots = test.java.srcDirs
          .findAll { it.isDirectory() }
          .collect { it.canonicalFile }
          .toSet()

        // Gradle may leave this output absent when a project has no resources.
        // The manifest still records a concrete resource root, so materialize
        // the empty directory before validating it on the consumer side.
        processResources.destinationDir.mkdirs()
        processTestResources.destinationDir.mkdirs()

        records.add(["project-path", projectPath])
        records.add(["java-home", javaHome])
        records.add(["java-release", javaRelease])
        records.add(["preview-features", previewFeatures])
        records.add(["resource-root", processResources.destinationDir])
        sourceRoots.each { records.add(["source-root", it]) }
        records.add(["test-resource-root", processTestResources.destinationDir])
        testSourceRoots.each { records.add(["test-source-root", it]) }
        // `allJava` includes configured generated-source directories. The
        // compiler task is included as well because plugins may add generated
        // inputs directly to compileJava without registering a source set.
        def productionSources = (main.allJava.files + compileJava.source.files)
        if (compileJava.options.generatedSourceOutputDirectory.present) {
          def generatedRoot = compileJava.options.generatedSourceOutputDirectory
            .get().asFile.canonicalFile
          if (generatedRoot.isDirectory()) {
            sourceRoots.add(generatedRoot)
            generatedSourceRoots.add(generatedRoot)
            records.add(["source-root", generatedRoot])
          }
          productionSources += compileJava.options.generatedSourceOutputDirectory
            .get().asFileTree.matching { include("**/*.java") }.files
        }
        productionSources.each { source ->
          if (source.isFile() && source.name.endsWith(".java")) {
            def canonicalSource = source.canonicalFile
            def generated = generatedSourceRoots.any {
              canonicalSource.toPath().startsWith(it.toPath())
            }
            records.add([generated ? "generated-source" : "source", canonicalSource])
          }
        }
        def testSources = (test.allJava.files + compileTestJava.source.files)
        if (compileTestJava.options.generatedSourceOutputDirectory.present) {
          def generatedTestRoot = compileTestJava.options.generatedSourceOutputDirectory
            .get().asFile.canonicalFile
          if (generatedTestRoot.isDirectory()) {
            testSourceRoots.add(generatedTestRoot)
            records.add(["test-source-root", generatedTestRoot])
          }
          testSources += compileTestJava.options.generatedSourceOutputDirectory
            .get().asFileTree.matching { include("**/*.java") }.files
        }
        testSources.each { source ->
          if (source.isFile() && source.name.endsWith(".java")) {
            records.add(["test-source", source.canonicalFile])
          }
        }
        if (processResources.destinationDir.isDirectory()) {
          processResources.destinationDir.eachFileRecurse { resource ->
            if (resource.isFile()) records.add(["resource", resource])
          }
        }
        if (processTestResources.destinationDir.isDirectory()) {
          processTestResources.destinationDir.eachFileRecurse { resource ->
            if (resource.isFile()) records.add(["test-resource", resource])
          }
        }
        main.compileClasspath.files.findAll { it.exists() }.each {
          records.add(["classpath", it])
        }
        [["compile", test.compileClasspath],
         ["runtime", test.runtimeClasspath]].each { scoped ->
          scoped[1].files.findAll { it.exists() }.each {
            records.add(["test-classpath", scoped[0], it])
          }
        }
        [["compile", selectedProject.configurations.getByName("compileClasspath")],
         ["runtime", selectedProject.configurations.getByName("runtimeClasspath")]].each { scoped ->
          def scope = scoped[0]
          def configuration = scoped[1]
          def unresolved = configuration.incoming.resolutionResult.allDependencies.findAll {
            it.metaClass.hasProperty(it, "failure") && it.failure != null
          }
          if (!unresolved.empty) {
            throw new GradleException("Unresolved ${scope} production dependencies: ${unresolved}")
          }
          configuration.incoming.resolutionResult.allComponents.each { component ->
            def id = component.id
            if (id instanceof ProjectComponentIdentifier) {
              if (id.projectPath != projectPath) {
                records.add(["project-dependency", scope, id.projectPath])
              }
            } else if (id instanceof ModuleComponentIdentifier) {
              records.add(["external-dependency", scope,
                           "${id.group}:${id.module}:${id.version}"])
            }
          }
          configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            if (artifact.file.isFile()) {
              def component = artifact.moduleVersion.id
              records.add(["external-artifact", scope,
                           "${component.group}:${component.name}:${component.version}",
                           artifact.file.canonicalFile,
                           dripsharpSha256(artifact.file)])
            }
          }
        }
        [["compile", selectedProject.configurations.getByName("testCompileClasspath")],
         ["runtime", selectedProject.configurations.getByName("testRuntimeClasspath")]].each { scoped ->
          def scope = scoped[0]
          def configuration = scoped[1]
          def unresolved = configuration.incoming.resolutionResult.allDependencies.findAll {
            it.metaClass.hasProperty(it, "failure") && it.failure != null
          }
          if (!unresolved.empty) {
            throw new GradleException("Unresolved ${scope} test dependencies: ${unresolved}")
          }
          configuration.incoming.resolutionResult.allComponents.each { component ->
            def id = component.id
            if (id instanceof ProjectComponentIdentifier) {
              if (id.projectPath != projectPath) {
                records.add(["test-project-dependency", scope, id.projectPath])
              }
            } else if (id instanceof ModuleComponentIdentifier) {
              records.add(["test-external-dependency", scope,
                           "${id.group}:${id.module}:${id.version}"])
            }
          }
          configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            if (artifact.file.isFile()) {
              def component = artifact.moduleVersion.id
              records.add(["test-external-artifact", scope,
                           "${component.group}:${component.name}:${component.version}",
                           artifact.file.canonicalFile,
                           dripsharpSha256(artifact.file)])
            }
          }
        }

        records = records.collect { record ->
          def rendered
          if (record.size() == 2) {
            def value = record[0] in ["project-path", "java-release", "preview-features"]
              ? record[1].toString()
              : record[1].canonicalFile.absolutePath
            rendered = [record[0], value]
          } else {
            rendered = record.collect { it.toString() }
          }
          if (rendered.any { it.contains("\t") || it.contains("\n") || it.contains("\r") }) {
            throw new GradleException("DripSharp cannot encode a value containing a tab or newline: ${rendered}")
          }
          rendered
        }.sort { left, right ->
          def kindOrder = [
            "project-path": 0,
            "java-home": 1,
            "java-release": 2,
            "preview-features": 3,
            "source-root": 4,
            "test-source-root": 5,
            "resource-root": 6,
            "test-resource-root": 7,
            "source": 8,
            "generated-source": 9,
            "test-source": 10,
            "resource": 11,
            "test-resource": 12,
            "classpath": 13,
            "test-classpath": 14,
            "project-dependency": 15,
            "external-dependency": 16,
            "external-artifact": 17,
            "test-project-dependency": 18,
            "test-external-dependency": 19,
            "test-external-artifact": 20,
          ]
          (kindOrder[left[0]] <=> kindOrder[right[0]]) ?: (left.join("\t") <=> right.join("\t"))
        }

        def outputFile = file(outputProperty.get())
        outputFile.parentFile.mkdirs()
        outputFile.withWriter("UTF-8") { writer ->
          writer.write("DRIPSHARP_GRADLE_INPUTS_V6\n")
          records.unique().each { record -> writer.write(record.join("\t") + "\n") }
        }
      }
    }
  }
}
