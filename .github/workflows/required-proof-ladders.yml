name: Required translator and product proofs

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-compat-conformance:
    name: Shared JavaCompat conformance
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      DRIPSHARP_WORKERS: 22
      JAVA_TOOL_OPTIONS: -Xmx28g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the conformance-runner resources
        shell: bash
        run: |
          available_kib=$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)
          available_cpu=$(getconf _NPROCESSORS_ONLN)
          if (( available_kib < 33554432 || available_cpu < 22 )); then
            echo "JavaCompat conformance requires at least 32 GiB available RAM and 22 CPUs."
            exit 1
          fi

      - name: Run the direct JVM-versus-.NET compatibility proof
        run: clojure -J-Xmx28g -M:run java-compat-differential

  rawhttp-conformance:
    name: Permanent RawHTTP reusable-translator conformance
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      DRIPSHARP_WORKERS: 22
      JAVA_TOOL_OPTIONS: -Xmx28g
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned RawHTTP source
        run: git submodule update --init --depth 1 research/rawhttp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the conformance-runner resources
        shell: bash
        run: |
          available_kib=$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)
          available_cpu=$(getconf _NPROCESSORS_ONLN)
          if (( available_kib < 33554432 || available_cpu < 22 )); then
            echo "RawHTTP conformance requires at least 32 GiB available RAM and 22 CPUs."
            exit 1
          fi

      - name: Run every required RawHTTP proof ladder
        run: clojure -J-Xmx28g -M:run proof rawhttp

  pkl-product-proof:
    name: Complete Pkl product proof ladder
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180
    env:
      DRIPSHARP_WORKERS: 22
      JAVA_TOOL_OPTIONS: -Xmx28g
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned Pkl source
        run: git submodule update --init --depth 1 research/pkl

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require the high-memory proof-runner resources
        shell: bash
        run: |
          available_kib=$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)
          available_cpu=$(getconf _NPROCESSORS_ONLN)
          if (( available_kib < 33554432 || available_cpu < 22 )); then
            echo "The complete Pkl proof requires at least 32 GiB available RAM and 22 CPUs."
            exit 1
          fi

      - name: Run every required Pkl proof ladder
        run: clojure -J-Xmx28g -M:run proof pkl
