name: PdfCube.PdfBox supported hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-proof:
    runs-on: [self-hosted, linux, x64, dripsharp-proof]
    timeout-minutes: 60
    env:
      DRIPSHARP_WORKERS: 22
      JAVA_TOOL_OPTIONS: -Xmx28g
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned PDFBox source
        run: git submodule update --init --depth 1 research/pdfbox

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify proof-runner resources
        shell: bash
        run: |
          available_kib=$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)
          available_cpu=$(getconf _NPROCESSORS_ONLN)
          if (( available_kib < 33554432 || available_cpu < 22 )); then
            echo "PdfCube.PdfBox package proof requires at least 32 GiB available RAM and 22 CPUs."
            exit 1
          fi

      - name: Pack, consume, and differentially verify
        run: clojure -J-Xmx28g -M:run proof pdfcube

      - name: Upload complete local feed
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-pdfbox-local-feed
          path: target/package-proof/feed/*.nupkg
          if-no-files-found: error

      - name: Upload aggregate canonical proof
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-pdfbox-canonical-proof
          path: validation-output/pdfcube-pdfbox-differential
          if-no-files-found: error

  host-smoke:
    needs: package-proof
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            architecture: x64
            runner: windows-2025
          - os: windows
            architecture: arm64
            runner: windows-11-arm
          - os: linux
            architecture: x64
            runner: ubuntu-24.04
          - os: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            architecture: x64
            runner: macos-15-intel
          - os: macos
            architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: pdfcube-pdfbox-local-feed
          path: target/pdfcube-pdfbox-printing-host-feed

      - uses: actions/download-artifact@v4
        with:
          name: pdfcube-pdfbox-canonical-proof
          path: target/pdfcube-pdfbox-canonical-proof

      - name: Build and smoke the package-only consumer
        shell: pwsh
        run: |
          $project = "validation/pdfcube-pdfbox-printing/PdfCube.PdfBox.PrintingHostSmoke.csproj"
          $config = "validation/pdfcube-pdfbox-printing/NuGet.Config"
          $packages = "target/pdfcube-pdfbox-host-packages"
          $canonical = "target/pdfcube-pdfbox-canonical-proof/host/upstream-printing.tsv"
          $trace = "target/pdfbox-host-${{ matrix.os }}-${{ matrix.architecture }}.tsv"
          dotnet --info | Out-File `
            "target/pdfbox-dotnet-${{ matrix.os }}-${{ matrix.architecture }}.txt" `
            -Encoding utf8
          dotnet restore $project --configfile $config --packages $packages `
            --no-cache --force --force-evaluate
          dotnet build $project --nologo --verbosity:minimal --no-restore `
            --no-incremental -warnaserror
          dotnet run --project $project --no-build --no-restore -- `
            $trace $canonical "${{ matrix.os }}" "${{ matrix.architecture }}"

      - name: Upload host evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-pdfbox-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            target/pdfbox-host-${{ matrix.os }}-${{ matrix.architecture }}.tsv
            target/pdfbox-dotnet-${{ matrix.os }}-${{ matrix.architecture }}.txt
          if-no-files-found: error
