name: PdfCube.XmpBox required macOS hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-proof:
    runs-on: [self-hosted, linux, x64, dripsharp-proof]
    timeout-minutes: 60
    env:
      DRIPSHARP_WORKERS: 22
      JAVA_TOOL_OPTIONS: -Xmx28g
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned PDFBox source
        run: git submodule update --init --depth 1 research/pdfbox

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify proof-runner resources
        shell: bash
        run: |
          available_kib=$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)
          available_cpu=$(getconf _NPROCESSORS_ONLN)
          if (( available_kib < 33554432 || available_cpu < 22 )); then
            echo "PdfCube.XmpBox package proof requires at least 32 GiB available RAM and 22 CPUs."
            exit 1
          fi

      - name: Pack, consume, and differentially verify
        run: >-
          clojure -J-Xmx28g -M:run differential
          pdfcube pdfcube-xmpbox-metadata

      - name: Upload complete local feed
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-xmpbox-local-feed
          path: target/package-proof/feed/*.nupkg
          if-no-files-found: error

      - name: Upload canonical proof
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-xmpbox-canonical-proof
          path: validation-output/pdfcube-xmpbox-metadata-differential
          if-no-files-found: error

      - name: Stage synchronized XmpBox fixtures
        shell: bash
        run: |
          fixture_root="target/pdfcube-xmpbox-host-fixtures"
          mkdir -p "$fixture_root"
          cp -R research/pdfbox/xmpbox/src/test/resources/. "$fixture_root/"

      - name: Upload synchronized XmpBox fixtures
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-xmpbox-host-fixtures
          path: target/pdfcube-xmpbox-host-fixtures
          if-no-files-found: error

  host-smoke:
    needs: package-proof
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            architecture: x64
            runner: macos-15-intel
          - os: macos
            architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: pdfcube-xmpbox-local-feed
          path: target/pdfcube-xmpbox-host-feed

      - uses: actions/download-artifact@v4
        with:
          name: pdfcube-xmpbox-canonical-proof
          path: target/pdfcube-xmpbox-canonical-proof

      - uses: actions/download-artifact@v4
        with:
          name: pdfcube-xmpbox-host-fixtures
          path: target/pdfcube-xmpbox-host-fixtures

      - name: Build and smoke the package-only consumer
        shell: pwsh
        run: |
          $project = "validation/pdfcube-xmpbox/PdfCube.XmpBox.HostSmoke.csproj"
          $config = "validation/pdfcube-xmpbox/NuGet.Config"
          $packages = "target/pdfcube-xmpbox-host-packages"
          $resources = "target/pdfcube-xmpbox-host-fixtures"
          $canonical = "target/pdfcube-xmpbox-canonical-proof/upstream-java.tsv"
          $trace = "target/xmpbox-host-${{ matrix.os }}-${{ matrix.architecture }}.tsv"
          dotnet --info | Out-File `
            "target/xmpbox-dotnet-${{ matrix.os }}-${{ matrix.architecture }}.txt" `
            -Encoding utf8
          dotnet restore $project --configfile $config --packages $packages `
            --no-cache --force --force-evaluate
          dotnet build $project --nologo --verbosity:minimal --no-restore `
            --no-incremental -warnaserror
          dotnet run --project $project --no-build --no-restore -- `
            $trace $resources $canonical `
            "${{ matrix.os }}" "${{ matrix.architecture }}"

      - name: Upload host evidence
        uses: actions/upload-artifact@v4
        with:
          name: pdfcube-xmpbox-${{ matrix.os }}-${{ matrix.architecture }}
          path: |
            target/xmpbox-host-${{ matrix.os }}-${{ matrix.architecture }}.tsv
            target/xmpbox-dotnet-${{ matrix.os }}-${{ matrix.architecture }}.txt
          if-no-files-found: error
