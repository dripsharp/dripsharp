import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.JavaVersion

gradle.projectsEvaluated {
  def projectPath = providers.gradleProperty("vibeformer.project").orElse(":pkl-parser").get()
  def selectedProject = gradle.rootProject.findProject(projectPath)
  if (selectedProject != null) {
    def compileJavaProvider = selectedProject.tasks.named("compileJava")
    def processResourcesProvider = selectedProject.tasks.named("processResources")
    selectedProject.tasks.register("vibeformerDescribeMain") {
      group = "vibeformer"
      description = "Reports resolved ${projectPath} production inputs to Vibeformer"
      dependsOn(compileJavaProvider, processResourcesProvider)

      doLast {
        def outputProperty = providers.gradleProperty("vibeformer.output")
        if (!outputProperty.present) {
          throw new GradleException("Missing required -Pvibeformer.output=<path>")
        }

        def sourceSets = selectedProject.extensions.getByType(SourceSetContainer)
        def main = sourceSets.getByName("main")
        def compileJava = compileJavaProvider.get()
        def processResources = processResourcesProvider.get()
        def javaHome = compileJava.javaCompiler.get().metadata.installationPath.asFile
        def javaRelease = compileJava.options.release.orNull
        if (javaRelease == null) {
          javaRelease = Integer.parseInt(JavaVersion.toVersion(compileJava.sourceCompatibility).majorVersion)
        }
        def previewFeatures = compileJava.options.compilerArgs.contains("--enable-preview")
        def records = []

        records.add(["project-path", projectPath])
        records.add(["java-home", javaHome])
        records.add(["java-release", javaRelease])
        records.add(["preview-features", previewFeatures])
        records.add(["resource-root", processResources.destinationDir])
        // `allJava` includes configured generated-source directories. The
        // compiler task is included as well because plugins may add generated
        // inputs directly to compileJava without registering a source set.
        (main.allJava.files + compileJava.source.files).each {
          if (it.isFile() && it.name.endsWith(".java")) records.add(["source", it])
        }
        if (compileJava.options.generatedSourceOutputDirectory.present) {
          compileJava.options.generatedSourceOutputDirectory.get().asFileTree
            .matching { include("**/*.java") }
            .files.each { records.add(["source", it]) }
        }
        processResources.destinationDir.eachFileRecurse { resource ->
          if (resource.isFile()) records.add(["resource", resource])
        }
        main.compileClasspath.files.findAll { it.exists() }.each {
          records.add(["classpath", it])
        }

        records = records.collect { record ->
          def value = record[0] in ["project-path", "java-release", "preview-features"]
            ? record[1].toString()
            : record[1].canonicalFile.absolutePath
          if (value.contains("\t") || value.contains("\n") || value.contains("\r")) {
            throw new GradleException("Vibeformer cannot encode path containing a tab or newline: ${value}")
          }
          [record[0], value]
        }.sort { left, right ->
          def kindOrder = [
            "project-path": 0,
            "java-home": 1,
            "java-release": 2,
            "preview-features": 3,
            "resource-root": 4,
            "source": 5,
            "resource": 6,
            "classpath": 7,
          ]
          (kindOrder[left[0]] <=> kindOrder[right[0]]) ?: (left[1] <=> right[1])
        }

        def outputFile = file(outputProperty.get())
        outputFile.parentFile.mkdirs()
        outputFile.withWriter("UTF-8") { writer ->
          writer.write("VIBEFORMER_GRADLE_INPUTS_V3\n")
          records.each { record -> writer.write("${record[0]}\t${record[1]}\n") }
        }
      }
    }
  }
}
